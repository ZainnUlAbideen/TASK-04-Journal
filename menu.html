<html>
<head>
    <title>Continental Hotel Reservation Form</title>
    <style>
        body {
            background-color: white;
            font-family: Arial;
        }

        form {
            background-color: lightgray;
            width: 520px;
            padding: 20px;
        }

        h2 {
            color: red;
            text-align: center;
            font-family: Verdana, sans-serif;
        }

        table {
            background-color: lightsteelblue;
            width: 100%;
            border: 2px solid black;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            font-family: "Times New Roman";
            font-size: 16px;
        }

        th {
            font-weight: bold;
            text-align: right;
            width: 35px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            background-color: white;
            border: 1px solid gray;
            padding: 4px;
        }

        .center {
            text-align: center;
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <h2>Continental Hotel Reservation Form</h2>

        <table>

            <tr>
                <td class="label">Name</td>
                <td><input type="text" name="name" size="35" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td class="label">Email</td>
                <td><input type="email" name="email" size="30" value="info@continental.pk"></td>
            </tr>

            <tr>
                <td class="label">Mobile No</td>
                <td><input type="tel" name="mobile" size="30" placeholder="Enter your cell number"></td>
            </tr>

            <tr>
                <td class="label">Arrival Time</td>
                <td><input type="text" name="arrival" size="25" placeholder="Enter your arrival time"></td>
            </tr>

            <tr>
                <td class="label">Departure</td>
                <td>
                    <input type="text" name="departure_date" size="14">
                    <input type="text" name="departure_time" size="14">
                </td>
            </tr>

            <tr>
                <td class="label">Room Type</td>
                <td>
                    <input type="radio" name="room" value="single"> Single
                    <input type="radio" name="room" value="double"> Double
                    <br>
                    <input type="radio" name="room" value="suite"> Presidential Suite
                </td>
            </tr>

            <tr>
                <td class="label">Preferences</td>
                <td>
                    <input type="checkbox" name="pref" value="nonsmoking"> Non-Smoking <br>
                    <input type="checkbox" name="pref" value="internet"> Internet <br>
                    <input type="checkbox" name="pref" value="mattress"> Firm Mattress
                </td>
            </tr>

            <tr>
                <td class="label">Mode of Payment</td>
                <td>
                    <input type="checkbox" name="pay" value="cash"> Cash
                    <input type="checkbox" name="pay" value="check"> Check
                    <br>
                    <input type="checkbox" name="pay" value="card"> Credit Card
                    <select name="card">
                        <option>Select Card</option>
                        <option>Visa</option>
                        <option>MasterCard</option>
                        <option>American Express</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" class="center">
                    <input type="submit" value="Send Data">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
